name: persist
version: 1.0.0
description: Stops the agent from quitting a coding task too early. Counts distinct failed approaches, and when it tries to give up below the floor, forces another attempt and makes it document what it tried.
author: Umar Faruk Saidu
license: MIT
manifest_version: 2
api_version: 1
tags: [guardrail, persistence, coding, debugging]
provides_hooks:
  - post_tool_call
  - pre_llm_call
  - pre_verify
  - transform_llm_output
  - on_session_finalize
  - on_session_reset
  - post_compaction
provides_commands:
  - persist
settings:
  min_attempts:
    type: integer
    default: 3
    description: Distinct failed approaches required before the agent may give up. 1 disables the gate.
